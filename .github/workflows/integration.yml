name: Integration (Docker)

# Manual + weekly only -- never on push/PR. This brings up the full Docker
# compose stack and round-trips a table through it, which is slow and needs
# a Docker daemon; ci.yml stays fast/Docker-free for every PR.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # Picked up by docker-compose.yml's flight-server build args, so the
      # image matches the client built two steps down -- see the Python-
      # version matrix note there and in README.
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run the Docker smoke test
        run: uv run python scripts/smoke_test.py
