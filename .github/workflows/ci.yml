name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  UV_FROZEN: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Type check
        run: uv run mypy flight_server scripts datahut_duckhouse

      - name: Security scan
        run: |
          uv run bandit -r flight_server scripts -q || true
          uv run safety check || true

      - name: Tests
        run: uv run pytest --cov=flight_server --cov=scripts --cov=datahut_duckhouse --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv.lock is up to date
        run: uv lock --check

  docker:
    needs: [test, lock-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - image: flight-server
            dockerfile: .devcontainer/flight-server.Dockerfile
          - image: xorq
            dockerfile: .devcontainer/xorq.Dockerfile
          - image: xorq-admin
            dockerfile: .devcontainer/xorq-admin.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/datahut-${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/datahut-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    needs: [test, lock-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write test .env (CI-only, not committed)
        run: |
          cp .devcontainer/.env.example .env
          {
            echo "MINIO_ROOT_USER=minioadmin"
            echo "MINIO_ROOT_PASSWORD=minioadmin-ci"
            echo "AWS_ACCESS_KEY_ID=minioadmin"
            echo "AWS_SECRET_ACCESS_KEY=minioadmin-ci"
          } >> .env

      - name: Start object store
        run: docker compose up -d minio minio-setup

      - name: Wait for MinIO
        run: timeout 90 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Tear down
        if: always()
        run: docker compose down -v
