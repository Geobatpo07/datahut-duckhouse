# DataHut-DuckHouse local stack.
#
# No secrets live in this file: every credential is read from `.env` at the repo
# root (copy it from `.devcontainer/.env.example`, or run `make env`). Build
# contexts are the repo root; Dockerfiles live in `.devcontainer/`.

name: datahut-duckhouse

x-common-env: &common-env
  env_file:
    - .env

services:
  xorq:
    build:
      context: .
      dockerfile: .devcontainer/xorq.Dockerfile
    container_name: xorq-service
    <<: *common-env
    environment:
      XORQ_STORAGE: ${XORQ_STORAGE:-xorq/metadata.db}
    ports:
      - "9980:9980"
    restart: unless-stopped
    networks:
      - duckhouse-net

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - duckhouse-net

  # One-shot: ensure the warehouse bucket exists.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    <<: *common-env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p local/duckhouse-warehouse || true
      "
    networks:
      - duckhouse-net

  flight-server:
    build:
      context: .
      dockerfile: .devcontainer/flight-server.Dockerfile
    container_name: flight-server
    <<: *common-env
    ports:
      - "8815:8815"
    volumes:
      - flight_data:/app/ingestion/data
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - duckhouse-net

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./config/trino/etc:/etc/trino
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - duckhouse-net

  xorq-admin:
    build:
      context: .
      dockerfile: .devcontainer/xorq-admin.Dockerfile
    container_name: xorq-admin
    environment:
      REACT_APP_XORQ_API_URL: ${REACT_APP_XORQ_API_URL:-http://xorq-service:9980}
    ports:
      - "8090:80"
    depends_on:
      xorq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - duckhouse-net

volumes:
  minio_data:
  flight_data:

networks:
  duckhouse-net:
